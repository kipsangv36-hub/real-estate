<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reports | PropertyTrack</title><style>
*{box-sizing:border-box;margin:0;padding:0}:root{--navy:#203d68;--blue:#35658e;--light:#f4f6fa;--border:#dfe4eb;--muted:#697586}body{font-family:Arial,sans-serif;background:var(--light);color:#273444;font-size:14px}a{text-decoration:none;color:inherit}.topbar{background:var(--navy);color:white;display:flex;align-items:center;gap:16px;padding:12px 18px;flex-wrap:wrap}.brand{font-weight:bold;font-size:17px;margin-right:auto}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{font-size:13px;padding:7px;border-radius:4px}.nav a:hover,.nav a.active{background:#3c5a84}.search{width:140px;padding:7px;border:1px solid #d5dce7;border-radius:5px}.user{font-size:12px}.container{max-width:1200px;margin:24px auto;padding:0 18px}h1{font-size:22px;margin-bottom:18px}button,.button{display:inline-block;border:0;border-radius:5px;background:var(--blue);color:white;padding:9px 13px;cursor:pointer;font-size:12px}.panel{background:white;border:1px solid var(--border);border-radius:7px;padding:16px;margin-bottom:18px}.report-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.stat{background:#f4f6fa;border:1px solid var(--border);border-radius:7px;padding:16px;text-align:center}.stat strong{display:block;font-size:23px;color:var(--navy)}.bar-row{display:grid;grid-template-columns:100px 1fr 35px;gap:10px;align-items:center;margin:10px 0;font-size:12px}.bar-track{height:14px;background:#edf0f4;border-radius:3px;overflow:hidden}.bar{height:100%;background:#86b66b}.offerbar{background:#e7c45e}.soldbar{background:#df777b}.withdrawnbar{background:#aaa}
</style></head><body><header class="topbar"><a class="brand" href="dashboard.html">PropertyTrack</a><nav class="nav"><a href="dashboard.html">Dashboard</a><a href="listings.html">Listings</a><a href="activity-log.html">Activity Log</a><a class="active" href="reports.html">Reports</a></nav><input class="search" placeholder="Search..."><span class="user"><span id="topUser">Guest</span> · <a href="login.html">Logout</a></span></header><main class="container"><h1>Reports</h1><p style="color:#697586;margin-bottom:14px">Logged in as <b id="reportUser">Guest</b> - showing real data from your listings.</p><div class="report-stats"><div class="stat"><strong id="totalR">-</strong><span>Total</span></div><div class="stat"><strong id="availR">-</strong><span>Available</span></div><div class="stat"><strong id="soldR">-</strong><span>Sold</span></div></div><div class="panel"><h3>Status Breakdown</h3><div class="bar-row"><span>Available</span><div class="bar-track"><div class="bar" id="barAvail" style="width:0%"></div></div><span id="numAvail">0</span></div><div class="bar-row"><span>Under Offer</span><div class="bar-track"><div class="bar offerbar" id="barOffer" style="width:0%"></div></div><span id="numOffer">0</span></div><div class="bar-row"><span>Sold</span><div class="bar-track"><div class="bar soldbar" id="barSold" style="width:0%"></div></div><span id="numSold">0</span></div><div class="bar-row"><span>Withdrawn</span><div class="bar-track"><div class="bar withdrawnbar" id="barWith" style="width:0%"></div></div><span id="numWith">0</span></div><br><button onclick="exportCSV()">Download CSV Report</button></div></main>
<script>
var user = localStorage.getItem('loggedInUser') || 'Guest';
document.getElementById('topUser').textContent = user; document.getElementById('reportUser').textContent = user;
var demo=[{status:'Available'},{status:'Under Offer'},{status:'Sold'},{status:'Available'},{status:'Withdrawn'}];var saved=JSON.parse(localStorage.getItem('properties')||'[]');var all=demo.concat(saved);var total=all.length;var avail=all.filter(function(x){return x.status==='Available'}).length;var offer=all.filter(function(x){return x.status==='Under Offer'}).length;var sold=all.filter(function(x){return x.status==='Sold'}).length;var withd=all.filter(function(x){return x.status==='Withdrawn'}).length;
document.getElementById('totalR').textContent=total;document.getElementById('availR').textContent=avail;document.getElementById('soldR').textContent=sold;document.getElementById('numAvail').textContent=avail;document.getElementById('numOffer').textContent=offer;document.getElementById('numSold').textContent=sold;document.getElementById('numWith').textContent=withd;document.getElementById('barAvail').style.width=(avail/total*100)+'%';document.getElementById('barOffer').style.width=(offer/total*100)+'%';document.getElementById('barSold').style.width=(sold/total*100)+'%';document.getElementById('barWith').style.width=(withd/total*100)+'%';
function exportCSV(){var csv='Title,Location,Price,Status,Plot\n';var allProps=JSON.parse(localStorage.getItem('properties')||'[]');allProps.forEach(function(p){csv+=p.title+','+p.location+','+p.price+','+p.status+','+p.plot+'\n'});var blob=new Blob([csv],{type:'text/csv'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='PropertyTrack-Report.csv';a.click();}
</script></body></html>
