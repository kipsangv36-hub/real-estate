<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Add Property | PropertyTrack</title><style>
*{box-sizing:border-box;margin:0;padding:0}:root{--navy:#203d68;--blue:#35658e;--light:#f4f6fa;--border:#dfe4eb;--muted:#697586}body{font-family:Arial,sans-serif;background:var(--light);color:#273444;font-size:14px}a{text-decoration:none;color:inherit}.topbar{background:var(--navy);color:white;display:flex;align-items:center;gap:16px;padding:12px 18px;flex-wrap:wrap}.brand{font-weight:bold;font-size:17px;margin-right:auto}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{font-size:13px;padding:7px;border-radius:4px}.nav a:hover,.nav a.active{background:#3c5a84}.search{width:140px;padding:7px;border:1px solid #d5dce7;border-radius:5px}.user{font-size:12px}.container{max-width:1200px;margin:24px auto;padding:0 18px}h1{font-size:22px;margin-bottom:18px}button,.button{display:inline-block;border:0;border-radius:5px;background:var(--blue);color:white;padding:9px 13px;cursor:pointer;font-size:12px}.secondary{background:#eef2f7;color:#24364b;border:1px solid var(--border)}.panel{background:white;border:1px solid var(--border);border-radius:7px;padding:16px;margin-bottom:18px}.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted)}.field input,.field select{padding:10px;border:1px solid var(--border);border-radius:5px;background:#fafbfe;font:inherit}.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}@media(max-width:900px){.form-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.form-grid{grid-template-columns:1fr}}
</style></head><body><header class="topbar"><a class="brand" href="dashboard.html">PropertyTrack</a><nav class="nav"><a href="dashboard.html">Dashboard</a><a class="active" href="listings.html">Listings</a><a href="activity-log.html">Activity Log</a><a href="reports.html">Reports</a></nav><input class="search" placeholder="Search..."><span class="user"><span id="topUser">Guest</span> · <a href="login.html">Logout</a></span></header><main class="container"><h1>Add New Property</h1><div class="panel"><form id="propForm"><div class="form-grid"><div class="field"><label>Property Title</label><input id="title" required placeholder="e.g. 4BR Bungalow"></div><div class="field"><label>Location</label><input id="location" required placeholder="e.g. Karen"></div><div class="field"><label>Price (KES)</label><input id="price" required placeholder="e.g. 42,000,000"></div><div class="field"><label>Status</label><select id="status"><option>Available</option><option>Under Offer</option><option>Sold</option><option>Withdrawn</option></select></div><div class="field"><label>Plot / Ref</label><input id="plot" required placeholder="e.g. FR209/1234"></div></div><div class="actions"><button type="submit">Save Property</button><a class="button secondary" href="listings.html">Cancel</a></div><p id="msg" style="margin-top:12px;color:green"></p></form></div></main>
<script>
document.getElementById('topUser').textContent = localStorage.getItem('loggedInUser') || 'Guest';
document.getElementById('propForm').addEventListener('submit',function(e){e.preventDefault();var p={title:document.getElementById('title').value,location:document.getElementById('location').value,price:document.getElementById('price').value,status:document.getElementById('status').value,plot:document.getElementById('plot').value,created:new Date().toLocaleString()};var arr=JSON.parse(localStorage.getItem('properties')||'[]');arr.push(p);localStorage.setItem('properties',JSON.stringify(arr));document.getElementById('msg').textContent='Saved! '+p.title+' added. Go to Listings to see it.';this.reset();});
</script></body></html>
