<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Activity Log | PropertyTrack</title><style>
*{box-sizing:border-box;margin:0;padding:0}:root{--navy:#203d68;--blue:#35658e;--light:#f4f6fa;--border:#dfe4eb;--muted:#697586}body{font-family:Arial,sans-serif;background:var(--light);color:#273444;font-size:14px}a{text-decoration:none;color:inherit}.topbar{background:var(--navy);color:white;display:flex;align-items:center;gap:16px;padding:12px 18px;flex-wrap:wrap}.brand{font-weight:bold;font-size:17px;margin-right:auto}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{font-size:13px;padding:7px;border-radius:4px}.nav a:hover,.nav a.active{background:#3c5a84}.search{width:140px;padding:7px;border:1px solid #d5dce7;border-radius:5px}.user{font-size:12px}.container{max-width:1200px;margin:24px auto;padding:0 18px}h1{font-size:22px;margin-bottom:18px}.table-wrap{overflow-x:auto;background:white;border:1px solid var(--border);border-radius:5px}table{border-collapse:collapse;width:100%;min-width:680px;font-size:12px}th{background:var(--navy);color:white;text-align:left;padding:10px 9px}td{padding:10px 9px;border-bottom:1px solid #e4e8ee}.badge{display:inline-block;padding:4px 8px;border-radius:12px;font-size:11px;background:#dbeafe;color:#1e40af}button{border:0;border-radius:5px;background:var(--blue);color:white;padding:9px 13px;cursor:pointer;font-size:12px}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap}.toolbar input{padding:9px;border:1px solid var(--border);border-radius:5px}
</style></head><body><header class="topbar"><a class="brand" href="dashboard.html">PropertyTrack</a><nav class="nav"><a href="dashboard.html">Dashboard</a><a href="listings.html">Listings</a><a class="active" href="activity-log.html">Activity Log</a><a href="reports.html">Reports</a></nav><input class="search" placeholder="Search..."><span class="user"><span id="topUser">Guest</span> · <a href="login.html">Logout</a></span></header><main class="container"><h1>Listing Activity Log</h1><div class="toolbar"><p>Audit trail of changes made to property listings.</p><div style="display:flex;gap:8px"><input id="searchBox" placeholder="Search activity..."><button onclick="clearLog()" style="background:#dc2626">Clear Log</button></div></div><p id="count" style="font-size:12px;color:#697586;margin-bottom:10px"></p><div class="table-wrap"><table><tr><th>Date and time</th><th>User</th><th>Listing</th><th>Action</th><th>Details</th></tr><tbody id="logBody"></tbody></table></div></main>
<script>
var currentUser = localStorage.getItem('loggedInUser') || 'Guest';
document.getElementById('topUser').textContent = currentUser;
var demo=[{date:'29 Sep 2026 09:12',user:'Admin',listing:'PL-0103',action:'Status change',details:'Under Offer → Sold'},{date:'28 Sep 2026 16:40',user:'Admin',listing:'PL-0105',action:'Withdrawn',details:'Reason: owner request'},{date:'28 Sep 2026 11:05',user:'Admin',listing:'PL-0102',action:'Status change',details:'Available → Under Offer'}];
function render(filter){var loginTime=localStorage.getItem('loginTime')||'';var saved=JSON.parse(localStorage.getItem('properties')||'[]');var all=[];if(loginTime)all.push({date:loginTime,user:currentUser,listing:'-',action:'Login',details:'User logged in to PropertyTrack',isNew:true});saved.slice().reverse().forEach(function(p,i){all.push({date:p.created||'Just now',user:currentUser,listing:'NEW-'+(saved.length-i),action:'Created',details:'New listing added: '+p.title+' in '+p.location+' - KES '+(p.price||'')+' - Status: '+p.status,isNew:true})});demo.forEach(function(d){all.push(d)});if(filter){var f=filter.toLowerCase();all=all.filter(function(r){return (r.date+' '+r.user+' '+r.listing+' '+r.action+' '+r.details).toLowerCase().includes(f)})}document.getElementById('count').textContent='Showing '+all.length+' activities';var tb=document.getElementById('logBody');tb.innerHTML='';all.forEach(function(r){var tr=document.createElement('tr');tr.innerHTML='<td>'+r.date+'</td><td>'+r.user+'</td><td>'+r.listing+'</td><td>'+r.action+(r.isNew?' <span class="badge">NEW</span>':'')+'</td><td>'+r.details+'</td>';tb.appendChild(tr)})}
function clearLog(){if(!confirm('Clear your saved activity?'))return;localStorage.removeItem('properties');render('')}
document.getElementById('searchBox').addEventListener('input',function(){render(this.value)});render('');
</script></body></html>
