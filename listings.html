<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Listings | PropertyTrack</title><style>
*{box-sizing:border-box;margin:0;padding:0}:root{--navy:#203d68;--blue:#35658e;--light:#f4f6fa;--border:#dfe4eb;--muted:#697586}body{font-family:Arial,sans-serif;background:var(--light);color:#273444;font-size:14px}a{text-decoration:none;color:inherit}.topbar{background:var(--navy);color:white;display:flex;align-items:center;gap:16px;padding:12px 18px;flex-wrap:wrap}.brand{font-weight:bold;font-size:17px;margin-right:auto}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{font-size:13px;padding:7px;border-radius:4px}.nav a:hover,.nav a.active{background:#3c5a84}.search{width:140px;padding:7px;border:1px solid #d5dce7;border-radius:5px}.user{font-size:12px}.container{max-width:1200px;margin:24px auto;padding:0 18px}h1{font-size:22px;margin-bottom:18px}.table-wrap{overflow-x:auto;background:white;border:1px solid var(--border);border-radius:5px}table{border-collapse:collapse;width:100%;min-width:680px;font-size:12px}th{background:var(--navy);color:white;text-align:left;padding:10px 9px}td{padding:10px 9px;border-bottom:1px solid #e4e8ee}.badge{display:inline-block;padding:4px 8px;border-radius:12px;font-size:11px;background:#e7f2e8;color:#386842}.offer{background:#fff0cc;color:#785e13}.sold{background:#f8dfe1;color:#8b3338}.withdrawn{background:#e7e7e7;color:#555}button,.button{display:inline-block;border:0;border-radius:5px;background:var(--blue);color:white;padding:9px 13px;cursor:pointer;font-size:12px}.secondary{background:#eef2f7;color:#24364b;border:1px solid var(--border)}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:9px;border:1px solid var(--border);border-radius:5px}
</style></head><body><header class="topbar"><a class="brand" href="dashboard.html">PropertyTrack</a><nav class="nav"><a href="dashboard.html">Dashboard</a><a class="active" href="listings.html">Listings</a><a href="activity-log.html">Activity Log</a><a href="reports.html">Reports</a></nav><input class="search" placeholder="Search..."><span class="user"><span id="topUser">Guest</span> · <a href="login.html">Logout</a></span></header><main class="container"><h1>All Listings</h1><div class="toolbar"><p id="count"></p><div style="display:flex;gap:8px"><input id="searchBox" placeholder="Search listings..."><select id="filterStatus"><option value="">All Status</option><option>Available</option><option>Under Offer</option><option>Sold</option><option>Withdrawn</option></select><a class="button" href="add-property.html">+ Add Property</a></div></div><div class="table-wrap"><table><tr><th>Title</th><th>Location</th><th>Price (KES)</th><th>Status</th><th>Plot / Ref</th><th>Action</th></tr><tbody id="listBody"></tbody></table></div></main>
<script>
document.getElementById('topUser').textContent = localStorage.getItem('loggedInUser') || 'Guest';
var demo=[{title:'3BR Maisonette',location:'Kilimani',price:'18,500,000',status:'Available',plot:'PL-0101'},{title:'2BR Apartment',location:'Westlands',price:'12,000,000',status:'Under Offer',plot:'PL-0102'},{title:'Commercial Plot',location:'Ruiru',price:'25,000,000',status:'Sold',plot:'PL-0103'},{title:'4BR Bungalow',location:'Karen',price:'42,000,000',status:'Available',plot:'PL-0104'},{title:'1BR Studio',location:'Ngong Rd',price:'6,500,000',status:'Withdrawn',plot:'PL-0105'}];
function render(){var saved=JSON.parse(localStorage.getItem('properties')||'[]');var all=[];saved.slice().reverse().forEach(function(p){all.push({title:p.title,location:p.location,price:p.price,status:p.status,plot:p.plot,isNew:true})});demo.forEach(function(d){all.push(d)});var q=document.getElementById('searchBox').value.toLowerCase();var f=document.getElementById('filterStatus').value;if(q)all=all.filter(function(x){return (x.title+' '+x.location+' '+x.plot).toLowerCase().includes(q)});if(f)all=all.filter(function(x){return x.status===f});document.getElementById('count').textContent='Showing '+all.length+' listings';var tb=document.getElementById('listBody');tb.innerHTML='';all.forEach(function(p){var cls=p.status==='Available'?'badge':p.status==='Under Offer'?'badge offer':p.status==='Sold'?'badge sold':'badge withdrawn';var tr=document.createElement('tr');tr.innerHTML='<td>'+p.title+(p.isNew?' <span class="badge">NEW</span>':'')+'</td><td>'+p.location+'</td><td>'+p.price+'</td><td><span class="'+cls+'">'+p.status+'</span></td><td>'+p.plot+'</td><td><button class="secondary" onclick="alert(\'Details: '+p.title+' - '+p.location+' - KES '+p.price+'\')">View</button></td>';tb.appendChild(tr)})}
document.getElementById('searchBox').addEventListener('input',render);document.getElementById('filterStatus').addEventListener('change',render);render();
</script></body></html>
