<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard | PropertyTrack</title><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#203d68;--blue:#35658e;--light:#f4f6fa;--border:#dfe4eb;--muted:#697586}
body{font-family:Arial,sans-serif;background:var(--light);color:#273444;font-size:14px}
a{text-decoration:none;color:inherit}.topbar{background:var(--navy);color:white;display:flex;align-items:center;gap:16px;padding:12px 18px;flex-wrap:wrap}
.brand{font-weight:bold;font-size:17px;margin-right:auto}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{font-size:13px;padding:7px;border-radius:4px}.nav a:hover,.nav a.active{background:#3c5a84}
.search{width:140px;padding:7px;border:1px solid #d5dce7;border-radius:5px}.user{font-size:12px}
.container{max-width:1200px;margin:24px auto;padding:0 18px}h1{font-size:22px;margin-bottom:18px}h2{font-size:16px;margin:20px 0 10px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:12px;margin-bottom:18px}.stat{background:white;border:1px solid var(--border);border-radius:7px;padding:16px 10px;text-align:center}.stat strong{display:block;font-size:23px;color:var(--navy);margin-bottom:6px}.stat span{font-size:12px;color:var(--muted)}
.alert{background:#fff3cd;border:1px solid #ead58a;border-radius:5px;padding:10px 12px;margin:12px 0 18px;color:#715b18;font-size:12px}
.table-wrap{overflow-x:auto;background:white;border:1px solid var(--border);border-radius:5px}table{border-collapse:collapse;width:100%;min-width:680px;font-size:12px}th{background:var(--navy);color:white;text-align:left;padding:10px 9px}td{padding:10px 9px;border-bottom:1px solid #e4e8ee}tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:4px 8px;border-radius:12px;font-size:11px;background:#e7f2e8;color:#386842}.offer{background:#fff0cc;color:#785e13}.sold{background:#f8dfe1;color:#8b3338}.withdrawn{background:#e7e7e7;color:#555}.stale{background:#fff0d9;color:#8b5a13}.newbadge{background:#dbeafe;color:#1e40af}
button,.button{display:inline-block;border:0;border-radius:5px;background:var(--blue);color:white;padding:9px 13px;cursor:pointer;font-size:12px}.secondary{background:#eef2f7;color:#24364b;border:1px solid var(--border)}
.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap}.toolbar input{padding:9px;border:1px solid var(--border);border-radius:5px}
.panel{background:white;border:1px solid var(--border);border-radius:7px;padding:16px;margin-bottom:18px}.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label,.login-container label{font-size:12px;color:var(--muted)}.field input,.field select{padding:10px;border:1px solid var(--border);border-radius:5px;background:#fafbfe;font:inherit}.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.report-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.bar-row{display:grid;grid-template-columns:100px 1fr 35px;gap:10px;align-items:center;margin:10px 0;font-size:12px}.bar-track{height:14px;background:#edf0f4;border-radius:3px;overflow:hidden}.bar{height:100%;background:#86b66b}.offerbar{background:#e7c45e}.soldbar{background:#df777b}.withdrawnbar{background:#aaa}
.login-container{width:90%;max-width:380px;margin:10vh auto;background:white;padding:30px 24px;border-radius:8px;box-shadow:0 4px 15px #00000012}.login-container h1{text-align:center;color:#29445f;margin-bottom:8px}.subtitle{text-align:center;color:#7b8490;font-size:13px;margin-bottom:25px}.login-container form{display:flex;flex-direction:column;gap:8px}.login-container input{padding:11px;margin-bottom:10px;border:1px solid var(--border);border-radius:7px;background:#f7f8fc}.login-container button{padding:12px;font-size:15px}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.form-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.container{padding:0 10px}.stats{grid-template-columns:repeat(2,1fr)}.form-grid,.report-stats{grid-template-columns:1fr}.search{width:100%}}
</style></head><body><header class="topbar"><a class="brand" href="dashboard.html">PropertyTrack</a><nav class="nav"><a class="active" href="dashboard.html">Dashboard</a><a class="" href="listings.html">Listings</a><a class="" href="activity-log.html">Activity Log</a><a class="" href="reports.html">Reports</a></nav><input class="search" placeholder="Search..."><span class="user">J. Kamau · <a href="login.html">Logout</a></span></header><main class="container"><h1>Dashboard</h1><section class="stats"><div class="stat"><strong id="total">-</strong><span>Total listings</span></div><div class="stat"><strong id="avail">-</strong><span>Available</span></div><div class="stat"><strong id="offer">-</strong><span>Under offer</span></div><div class="stat"><strong id="sold">-</strong><span>Sold</span></div><div class="stat"><strong id="stale">-</strong><span>Stale (14+ days)</span></div><div class="stat"><strong id="dup">-</strong><span>Possible duplicates</span></div></section><div class="alert" id="alertBox">Loading...</div><h2>Recently updated</h2><div class="table-wrap"><table><tr><th>Ref</th><th>Title</th><th>Status</th><th>Updated</th></tr><tbody id="recentBody"></tbody></table></div><div style="margin-top:16px"><a class="button" href="add-property.html">+ Add listing</a> <a class="button secondary" href="listings.html">View all listings</a></div></main>
<script>
var demo = [
  {ref:'PL-0103', title:'Commercial Plot, Ruiru', status:'Sold', updated:'Today', stale:false},
  {ref:'PL-0105', title:'1BR Studio, Ngong Rd', status:'Withdrawn', updated:'1 day ago', stale:false},
  {ref:'PL-0101', title:'3BR Maisonette, Kilimani', status:'Available', updated:'2 days ago', stale:false},
  {ref:'PL-0102', title:'2BR Apartment, Westlands', status:'Under Offer', updated:'5 days ago', stale:false},
  {ref:'PL-0106', title:'3BR Townhouse, Lavington', status:'Available', updated:'16 days ago', stale:true},
  {ref:'PL-0104', title:'4BR Bungalow, Karen', status:'Available', updated:'21 days ago', stale:true}
];
function badgeClass(s){
  if(s==='Under Offer') return 'badge offer';
  if(s==='Sold') return 'badge sold';
  if(s==='Withdrawn') return 'badge withdrawn';
  return 'badge';
}
var saved = JSON.parse(localStorage.getItem('properties') || '[]');
var all = [];
saved.slice().reverse().forEach(function(p, i){
  all.push({ref:'NEW-' + (saved.length - i), title: p.title + ', ' + p.location, status: p.status, updated: p.created || 'Just now', stale:false, isNew:true});
});
demo.forEach(function(d){ all.push(d); });

var total = all.length;
var avail = all.filter(function(x){ return x.status==='Available'; }).length;
var offer = all.filter(function(x){ return x.status==='Under Offer'; }).length;
var sold = all.filter(function(x){ return x.status==='Sold'; }).length;
var stale = all.filter(function(x){ return x.stale; }).length;

var plots = {};
var dup = 0;
all.forEach(function(x){
  var key = (x.title||'').toLowerCase();
});
saved.forEach(function(p){
  if(p.plot){
    var k = p.plot.toLowerCase().trim();
    if(plots[k]) dup++;
    plots[k]=1;
  }
});

document.getElementById('total').textContent = total;
document.getElementById('avail').textContent = avail;
document.getElementById('offer').textContent = offer;
document.getElementById('sold').textContent = sold;
document.getElementById('stale').textContent = stale;
document.getElementById('dup').textContent = dup;
document.getElementById('alertBox').textContent = '⚠ ' + stale + ' listings have not been updated in 14 days. ' + dup + ' possible duplicate entries need review. You have saved ' + saved.length + ' new listing(s).';

var tbody = document.getElementById('recentBody');
all.slice(0,6).forEach(function(r){
  var tr = document.createElement('tr');
  var extra = r.isNew ? ' <span class="badge newbadge">NEW</span>' : '';
  tr.innerHTML = '<td>'+r.ref+'</td><td>'+r.title+'</td><td><span class="'+badgeClass(r.status)+'">'+r.status+'</span>'+extra+'</td><td>'+r.updated+'</td>';
  tbody.appendChild(tr);
});
</script>
</body></html>
